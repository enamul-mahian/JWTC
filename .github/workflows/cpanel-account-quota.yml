name: Inspect cPanel Account Quota Read Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpanel-account-quota.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpanel-staging-operations
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
      APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
    steps:
      - name: Verify disk and inode limits with no writes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$APP_PATH" == /home/dropoqux/joingallagher.uk ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh -T -p "$SSH_PORT" -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/hosts" -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" 'if command -v uapi >/dev/null 2>&1; then uapi --output=json Quota get_local_quota_info | python3 -c "import json,sys; o=json.load(sys.stdin); print(json.dumps(o.get(\"result\",{}).get(\"data\",{}),indent=2))"; else echo UAPI_UNAVAILABLE; fi; quota -v 2>/dev/null || true'
      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/hosts"
