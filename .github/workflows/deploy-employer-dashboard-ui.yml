name: Deploy Employer Dashboard UI (verified + rollback)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-employer-dashboard-ui.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: cpanel-staging-operations
  cancel-in-progress: false

jobs:
  employer-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TESTED_UI_SHA: fa6692851d88e9f00b66884e27ab72769be325dd
      SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
      APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
      STAGING_DB_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}
      STAGING_DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify proven UI revision and exact release scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == enamul-mahian/JWTC ]]
          [[ "$APP_PATH" == /home/dropoqux/joingallagher.uk ]]
          [[ "$STAGING_DB_DATABASE" == dropoqux_jwtc_stage ]]
          [[ "$STAGING_DB_USERNAME" == dropoqux_jwtc_stage ]]
          for k in SSH_HOST SSH_PORT SSH_USER SSH_KEY KNOWN_HOSTS APP_PATH STAGING_DB_PASSWORD; do
            [[ -n "${!k}" ]] || { echo "::error::Missing $k"; exit 1; }
          done
          php -l scripts/release/deploy_employer_dashboard_ui.php
          gh api "repos/enamul-mahian/JWTC/actions/runs?head_sha=$TESTED_UI_SHA&per_page=30" > "$RUNNER_TEMP/tested-ui-ci.json"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/tested-ui-ci.json'))['workflow_runs']
          assert any(r['name']=='JWTC Pre-merge Validation' and r['head_sha']==os.environ['TESTED_UI_SHA'] and r['conclusion']=='success' for r in runs), 'CI for exact UI source is not green'
          files=[
            'resources/views/frontend/layout/frontMaster.blade.php',
            'resources/views/frontend/pages/job/list.blade.php',
            'resources/views/frontend/pages/manegeJob/list.blade.php',
            'public/theme/employer-jobs.css'
          ]
          for path in files:
              tested=subprocess.check_output(['git','show',os.environ['TESTED_UI_SHA']+':'+path])
              if path.endswith('/list.blade.php'):
                  tested=tested.replace(b'employer-jobs.css\') }}?v=20261025-1',b'employer-jobs.css\') }}?v=20261025-2')
              current=pathlib.Path(path).read_bytes()
              assert tested == current, 'UI source differs from CI-approved code: '+path
          print('PASS: production UI matches CI-approved PR #57, only CSS cache-busting query is new')
          PY

      - name: Run focused regression test and compile every Blade template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test --filter=EmployerWorkspaceLayoutTest --no-ansi
          php artisan view:cache

      - name: Prepare exact four-file package and secure SSH key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/employer-ui-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/employer-ui-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/employer-ui-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/employer-ui-ssh/key" >/dev/null
          tar -czf "$RUNNER_TEMP/employer-ui-release.tar.gz" \
            resources/views/frontend/layout/frontMaster.blade.php \
            resources/views/frontend/pages/job/list.blade.php \
            resources/views/frontend/pages/manegeJob/list.blade.php \
            public/theme/employer-jobs.css
          target="/home/dropoqux/jwtc-private-workhub-incoming/$GITHUB_SHA"
          ssh -T -p "$SSH_PORT" -i "$RUNNER_TEMP/employer-ui-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/employer-ui-ssh/known_hosts" -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "umask 077; test ! -L '$target' && mkdir -p '$target'"
          scp -P "$SSH_PORT" -i "$RUNNER_TEMP/employer-ui-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/employer-ui-ssh/known_hosts" \
            "$RUNNER_TEMP/employer-ui-release.tar.gz" "$SSH_USER@$SSH_HOST:$target/employer-ui-release.tar.gz"

      - name: Create immediate independently encrypted production backup
        shell: bash
        run: |
          set -euo pipefail
          code="$(base64 -w0 scripts/release/create_approved_backup.php)"
          python3 -c 'import os,json; print(json.dumps({"database":os.environ["STAGING_DB_DATABASE"],"username":os.environ["STAGING_DB_USERNAME"],"password":os.environ["STAGING_DB_PASSWORD"]}))' |
            ssh -T -p "$SSH_PORT" -i "$RUNNER_TEMP/employer-ui-ssh/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/employer-ui-ssh/known_hosts" -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "$SSH_USER@$SSH_HOST" "cd '$APP_PATH' && php -r 'eval(\"?>\".base64_decode(\"$code\"));'"

      - name: Deploy UI and confirm public stylesheet HTTP 200 + SHA256
        shell: bash
        run: |
          set -euo pipefail
          code="$(base64 -w0 scripts/release/deploy_employer_dashboard_ui.php)"
          export ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/employer-ui-release.tar.gz" | cut -d' ' -f1)"
          python3 -c 'import os,json,hashlib
          files=[
            "resources/views/frontend/layout/frontMaster.blade.php",
            "resources/views/frontend/pages/job/list.blade.php",
            "resources/views/frontend/pages/manegeJob/list.blade.php",
            "public/theme/employer-jobs.css"]
          hashes={p:hashlib.sha256(open(p,"rb").read()).hexdigest() for p in files}
          print(json.dumps({"release_sha":os.environ["GITHUB_SHA"],"archive_sha256":os.environ["ARCHIVE_SHA256"],"hashes":hashes}))' |
            ssh -T -p "$SSH_PORT" -i "$RUNNER_TEMP/employer-ui-ssh/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/employer-ui-ssh/known_hosts" -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
              "$SSH_USER@$SSH_HOST" "cd '$APP_PATH' && php -r 'eval(\"?>\".base64_decode(\"$code\"));'"

      - name: Delete temporary identity
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/employer-ui-ssh/key" "$RUNNER_TEMP/employer-ui-ssh/known_hosts" "$RUNNER_TEMP/employer-ui-release.tar.gz"
