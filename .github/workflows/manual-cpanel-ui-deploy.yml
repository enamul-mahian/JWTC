name: Manual cPanel Job Details UI Deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type joingallagher.uk to approve UI-only deployment"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: joingallagher-ui-only
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'joingallagher.uk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          HOST: ${{ secrets.CPANEL_SSH_HOST }}
          USER: ${{ secrets.CPANEL_SSH_USER }}
          PORT: ${{ secrets.CPANEL_SSH_PORT }}
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HOST USER PORT KEY KNOWN_HOSTS; do
            test -n "${!name}" || { echo "::error::Missing SSH secret $name"; exit 1; }
          done
          [[ "$PORT" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/jg_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/jg_key ~/.ssh/known_hosts
          printf 'Host jg-cpanel\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/jg_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" "$USER" "$PORT" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Verify exact Laravel application and back up existing UI
        env:
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          set -euo pipefail
          test -n "$APP_PATH"
          [[ "$APP_PATH" == /* && "$APP_PATH" != "/" ]] || { echo "::error::Invalid APP_PATH"; exit 1; }
          printf -v quoted_path '%q' "$APP_PATH"
          ssh jg-cpanel "APP_PATH=$quoted_path bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          test -f artisan && test -f bootstrap/app.php && test -f .env
          test -f resources/views/frontend/pages/job/details.blade.php
          test -f public/theme/job-details-layout.css
          grep -Eq '^APP_URL=https?://(www\.)?joingallagher\.uk/?$' .env || { echo "APP_URL mismatch, refusing deployment"; exit 1; }
          test ! -L resources/views/frontend/pages/job/details.blade.php
          test ! -L public/theme/job-details-layout.css
          mkdir -p storage/app/ui-release-backups
          chmod 700 storage/app/ui-release-backups
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="storage/app/ui-release-backups/$stamp"
          mkdir -m 700 "$backup"
          cp -p resources/views/frontend/pages/job/details.blade.php "$backup/details.blade.php"
          cp -p public/theme/job-details-layout.css "$backup/job-details-layout.css"
          echo "$backup" > storage/app/ui-release-backups/last-backup-path
          REMOTE
      - name: Copy only approved UI files
        env:
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          set -euo pipefail
          scp resources/views/frontend/pages/job/details.blade.php "jg-cpanel:$APP_PATH/resources/views/frontend/pages/job/details.blade.php"
          scp public/theme/job-details-layout.css "jg-cpanel:$APP_PATH/public/theme/job-details-layout.css"
      - name: Clear Blade compiled views only
        env:
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          set -euo pipefail
          printf -v quoted_path '%q' "$APP_PATH"
          ssh jg-cpanel "APP_PATH=$quoted_path bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          php artisan view:clear
          echo 'Job Details UI deployed; no database or other domain changed.'
          REMOTE
